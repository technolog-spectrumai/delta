# Generated by the Delta Builder (tools/) — review before deploying.
#
# Bring it up with:
#   python delta/scripts/deploy.py delta/deploy/configs/<this file> up --smart
# Validate without touching anything:
#   ... <this file> validate
#
# delta is an e-learning host: the course/task/skill core is always built, and the
# capabilities below are what varies. Keys left out keep deploy.py's defaults.

deployment:
  name: delta                         # compose project, .env and .compose dir name
  project_dir: delta

server: wsgi                          # gunicorn (wsgi)

target:
  type: local                         # local = this machine

ssl:
  mode: gervazy                       # gervazy = self-signed, no DNS needed

env:
  DJANGO_ENV: PROD
  DEBUG: "0"
  RESET: "1"
  FULL_INGRESS: "1"
  LANGUAGE_CODE: pl                   # delta's students are Polish-speaking by default
  DB_NAME: delta
  DB_USER: delta
  DB_PASSWORD: change_me_in_prod      # postgres password
  DB_PORT: "5432"
  REDIS_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  PLATFORM_NAME: Delta                # shown in the UI
  PLATFORM_LOGO_PATH: ../data/img/delta.png
  EMAIL_BACKEND: console
  LOGIN_RETRY_COOLDOWN_SECONDS: "1"
  PLATFORM_DOMAIN: localhost
  ALLOWED_HOSTS: localhost,127.0.0.1,web_delta,nginx,delta.local
  CSRF_TRUSTED_ORIGINS: https://localhost,https://localhost:8443
  BUILD_GEO: "1"
  BUILD_AUTHORING: "1"
  BUILD_LIBRARY: "1"
  BUILD_SUBSCRIPTIONS: "1"
  BUILD_VOD: "1"
  BUILD_SOCIAL_LOGIN: "1"

admin:
  username: admin                     # the superuser init_platform creates
  person:
    display_name: Delta Admin

services:
  celery: true

nginx:
  http_port: 8082                     # host port → container 80
  https_port: 8443                    # host port → container 443
  bind: 127.0.0.1                     # 127.0.0.1 = loopback only

cert:
  common_name: localhost
  dns_names:
    - localhost
  ip_addresses:
    - 127.0.0.1
