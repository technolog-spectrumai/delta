{% load static %}
{# Vendored KaTeX (offline-safe) + auto-render. Renders $…$ / $$…$$ math inside
   any element carrying the .js-math class. Included on both student pages and
   the back-office editor preview. #}
<link rel="stylesheet" href="{% static 'quizzes/vendor/katex/katex.min.css' %}">
<script defer src="{% static 'quizzes/vendor/katex/katex.min.js' %}"></script>
<script defer src="{% static 'quizzes/vendor/katex/contrib/auto-render.min.js' %}"></script>
<script>
  window.quizKatexOptions = {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "$", right: "$", display: false },
      { left: "\\(", right: "\\)", display: false },
      { left: "\\[", right: "\\]", display: true }
    ],
    throwOnError: false
  };
  document.addEventListener("DOMContentLoaded", function () {
    if (!window.renderMathInElement) return;
    document.querySelectorAll(".js-math").forEach(function (el) {
      try { window.renderMathInElement(el, window.quizKatexOptions); } catch (e) {}
    });
  });
</script>
